[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "bambu-studio-mcp"
version = "0.1.0"
description = "Agentic headless slicing through shared REST and MCP over the official Bambu Studio engine"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.3,<5",
    "mcp>=2,<3",
    "pydantic>=2.12,<3",
    "pydantic-core>=2.41,<3",
    "starlette>=1.0.1,<2",
    "uvicorn>=0.40,<1",
    "typing-extensions>=4.13,<5",
]
license = {file = "LICENSE.txt"}
readme = "README.md"

[project.urls]
Homepage = "https://github.com/MoraesGil/bambu-studio-mcp"
Repository = "https://github.com/MoraesGil/bambu-studio-mcp"
Issues = "https://github.com/MoraesGil/bambu-studio-mcp/issues"

[project.optional-dependencies]
test = [
    "httpx2>=2.16,<3",
    "mypy==2.4.0",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
bambu-studio-mcp = "bambu_studio_mcp.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY.md" = "bambu_studio_mcp/THIRD_PARTY.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["src/bambu_studio_mcp"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
